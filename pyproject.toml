[project]
name = "ai-quant-agent"
version = "0.1.0"
description = "AI Quant Trading Agent: LLM orchestration layer on top of Hummingbot"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "mcp>=1.0.0",
    "hummingbot-api-client>=1.2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "integrations*", "dashboard_api*", "analytics*"]
