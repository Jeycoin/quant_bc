# Trading mode is decided by LIVE_TRADING env var, not by this file.
# These limits are the agent-facing safety boundary. The agent may tune
# strategy parameters inside these bounds; it may not widen the bounds.

safety:
  # Connectors the agent is allowed to trade on in PAPER mode.
  paper_connector_patterns:
    - "_paper_trade"   # e.g. binance_paper_trade
    - "testnet"        # e.g. hyperliquid testnet connectors

  # Symbols the agent may analyze and trade.
  # Note: hyperliquid perp pairs are quoted in USD (BTC-USD), spot in USDC (UBTC-USDC).
  allowed_quote_assets: ["USDT", "USDC", "USD"]
  allowed_base_assets: ["BTC", "UBTC", "ETH", "UETH", "SOL"]

  # Hard per-trade limits (quote currency).
  max_order_quote_amount: 500
  max_open_positions: 3

  # Tool-call rules: actions the agent can never invoke, in any mode.
  blocked_tool_actions:
    setup_connector: ["delete"]        # never delete credentials
    manage_bots: []                    # bot lifecycle allowed
    manage_executors: []               # executors allowed (subject to paper checks)

memory:
  sqlite_path: "data/agent_memory.db"

# Deterministic cost gate (agent/validators.py). The LLM proposes trades;
# these numbers decide whether a trade has positive expected economics.
# Fees are per side, as fractions of quote notional.
cost:
  maker_fee: 0.0002        # limit orders (grid levels, TP limits)
  taker_fee: 0.0005        # market orders (position entry/exit)
  slippage_pct: 0.0002     # expected total slippage per round trip
  safety_margin_pct: 0.0003

# Portfolio-level risk limits (agent/validators.py RiskValidator), evaluated
# from actual account state — not from the LLM's self-report.
risk:
  max_total_exposure_quote: 1500
  max_symbol_exposure_quote: 600
  max_drawdown_pct: 10     # enforced when equity history is available

# Grid protection state machine thresholds (agent/validators.py).
grid_protection:
  warn_trend_rise: 1.25          # trend_strength ratio vs previous window
  defensive_trend_strength: 0.004  # |EMA20-EMA50|/price above this -> DEFENSIVE
  warn_atr_rise: 1.3             # atr_pct ratio vs previous window
  breakout_atr_mult: 0.5         # close beyond 48-bar range by 0.5*ATR -> EXIT
  news_severity_warn: 0.8        # external news severity that forces WARNING
