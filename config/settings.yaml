# Trading mode is decided by LIVE_TRADING env var, not by this file.
# These limits are the agent-facing safety boundary. The agent may tune
# strategy parameters inside these bounds; it may not widen the bounds.

safety:
  # Connectors the agent is allowed to trade on in PAPER mode.
  paper_connector_patterns:
    - "_paper_trade"   # e.g. binance_paper_trade
    - "testnet"        # e.g. hyperliquid testnet connectors

  # Symbols the agent may analyze and trade.
  # Note: hyperliquid perp pairs are quoted in USD (BTC-USD), spot in USDC (UBTC-USDC).
  allowed_quote_assets: ["USDT", "USDC", "USD"]
  allowed_base_assets: ["BTC", "UBTC", "ETH", "UETH", "SOL", "XRP", "SUI"]

  # Hard per-trade limits (quote currency).
  max_order_quote_amount: 500
  max_open_positions: 3

  # Tool-call rules: actions the agent can never invoke, in any mode.
  blocked_tool_actions:
    setup_connector: ["delete"]        # never delete credentials
    manage_bots: []                    # bot lifecycle allowed
    manage_executors: []               # executors allowed (subject to paper checks)

memory:
  sqlite_path: "data/agent_memory.db"

# Deterministic cost gate (agent/validators.py). The LLM proposes trades;
# these numbers decide whether a trade has positive expected economics.
# Fees are per side, as fractions of quote notional.
cost:
  maker_fee: 0.0002        # limit orders (grid levels, TP limits)
  taker_fee: 0.0005        # market orders (position entry/exit)
  slippage_pct: 0.0002     # expected total slippage per round trip
  safety_margin_pct: 0.0003
  funding_interval_hours: 8   # perpetual funding settlement cadence
  expected_hold_hours: 8      # assumed position holding window for funding cost

# Portfolio-level risk limits (agent/validators.py RiskValidator), evaluated
# from actual account state — not from the LLM's self-report.
risk:
  # ELEVATED 2026-10-05 per user request (aggressive risk-appetite experiment,
  # TESTNET only — restore to 1500/600 before any LIVE deployment)
  max_total_exposure_quote: 8000
  max_symbol_exposure_quote: 4000
  max_drawdown_pct: 10     # enforced when equity history is available
  # Fallback notional when the LLM omits position size entirely (v1.4.2).
  # Kept at the per-trade safety cap so an unspecified size can never
  # exceed max_order_quote_amount.
  default_position_notional_quote: 500

# Grid protection state machine thresholds (agent/validators.py).
grid_protection:
  warn_trend_rise: 1.25          # trend_strength ratio vs previous window
  defensive_trend_strength: 0.004  # |EMA20-EMA50|/price above this -> DEFENSIVE
  warn_atr_rise: 1.3             # atr_pct ratio vs previous window
  breakout_atr_mult: 0.5         # close beyond 48-bar range by 0.5*ATR -> EXIT
  news_severity_warn: 0.8        # external news severity that forces WARNING

# Deterministic entry gate for directional trades (agent/validators.py
# validate_entry, framework v0.5 — see docs/research/crypto-quant-frontier-notes.md).
# Direction must align with 8h momentum and the EMA(8/21) cross; RSI extremes
# block chase entries; BREAKOUT needs volume confirmation; RANGING is for
# grids, not positions.
entry_gate:
  enabled: true
  rsi_overbought: 75
  rsi_oversold: 25
  breakout_volume_z: 1.0
  # v0.8 pullback discipline (replay evidence exp-2e40edd765ca: chasing the
  # top of the 4h range was the biggest long-side loss source).
  # null disables either rule.
  long_max_pos: 0.6      # LONG only in the lower 60% of the 8-bar range
  short_min_pos: 0.4     # SHORT only in the upper 60%
  min_vol_ratio: 0.7     # block entries when vol_8bar/vol_48bar collapses

# Post-hoc circuit breakers (agent/protections.py, v1.4 — Freqtrade
# Protections adapted). Evaluated from closed-trade OUTCOMES, orthogonal to
# the pre-trade gates above. Replaces the ad-hoc backtest cooldown.
protections:
  enabled: true
  cooldown_hours: 0        # per-symbol lock after ANY close (0 = off)
  cooldown_stop_hours: 6   # per symbol+side lock after a losing/stop close
  stoploss_guard:          # losing streak -> global pause
    enabled: true
    lookback_hours: 24
    trade_limit: 4
    stop_duration_hours: 6
  max_drawdown:            # realized-PnL drawdown -> global pause
    enabled: true
    lookback_hours: 72
    max_allowed_pct: 3     # of reference equity (10k)
    stop_duration_hours: 12
  low_profit_pairs:        # persistent losers get blacklisted
    enabled: true
    lookback_hours: 168
    min_trades: 4
    required_profit_quote: 0
    stop_duration_hours: 72

# ---------------------------------------------------------------------------
# Tunable gate parameters (v1.5): the ONLY knobs the AI may adjust, each
# inside a hard-coded [min, max] envelope. Hard safety boundaries (safety:
# section, risk: section ceilings, LIVE_TRADING switch) are NOT here and can
# never be proposed by the AI. Mechanism: agent/tunable.py validates the
# AI's gate_adjustments against this table, clamps out-of-range values
# (clamp events are logged to decision_events), and the gates evaluate with
# the effective per-decision parameter set. Scope is per-decision — global
# changes still require a human edit of this file.
#
# Deviation note: the red-line range for grid take_profit was 0.5%-5%, but
# current production grids run tp 0.1%-0.2% (both live executors and the
# replay GRID_TP=0.002); a 0.5% floor would clamp every existing grid
# config. The floor is therefore 0.1% — revisit when grid economics are
# re-validated.
tunable:
  # --- entry gate thresholds (agent/validators.py validate_entry)
  entry_gate.rsi_overbought: {default: 75, min: 65, max: 85}
  entry_gate.rsi_oversold: {default: 25, min: 15, max: 35}
  entry_gate.breakout_volume_z: {default: 1.0, min: 0.5, max: 2.5}
  entry_gate.long_max_pos: {default: 0.6, min: 0.5, max: 0.8}
  entry_gate.short_min_pos: {default: 0.4, min: 0.2, max: 0.5}
  entry_gate.min_vol_ratio: {default: 0.7, min: 0.4, max: 1.0}
  # --- trade window / cooldown
  time_stop_hours: {default: 6, min: 2, max: 24}
  protections.cooldown_stop_hours: {default: 6, min: 0, max: 12}
  # --- executor barriers (clamped on executor configs)
  grid_take_profit_pct: {default: 0.002, min: 0.001, max: 0.05}
  grid_stop_loss_pct: {default: 0.02, min: 0.005, max: 0.05}
  position_take_profit_pct: {default: 0.02, min: 0.005, max: 0.05}
  position_stop_loss_pct: {default: 0.01, min: 0.005, max: 0.03}
  # --- circuit breakers (risk.max_drawdown_pct=10 stays a hard ceiling,
  #     this is only the protections-layer realized-PnL trip)
  protections.stoploss_guard.trade_limit: {default: 4, min: 2, max: 8}
  protections.max_drawdown.max_allowed_pct: {default: 3, min: 1, max: 6}
  protections.low_profit_pairs.min_trades: {default: 4, min: 2, max: 10}
  protections.low_profit_pairs.required_profit_quote: {default: 0, min: -5, max: 5}
  # --- decision knobs
  min_confidence: {default: 0.6, min: 0.5, max: 0.85}
  leverage: {default: 1, min: 1, max: 20}
  position_notional_quote: {default: 200, min: 50, max: 500}
  # --- grid protection state machine thresholds
  grid_protection.warn_trend_rise: {default: 1.25, min: 1.05, max: 2.0}
  grid_protection.defensive_trend_strength: {default: 0.004, min: 0.002, max: 0.01}
  grid_protection.warn_atr_rise: {default: 1.3, min: 1.05, max: 2.0}
  grid_protection.breakout_atr_mult: {default: 0.5, min: 0.25, max: 1.5}
